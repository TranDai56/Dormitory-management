{% extends 'base.html' %}

{% block title %}Gia hạn xe {{ xe.bienso }} - Ký Túc Xá{% endblock %}

{% block breadcrumb %}
    <a href="{% url 'danh_sach_xe' %}" class="text-decoration-none text-secondary">Gửi xe</a>
    <i class="fa-solid fa-chevron-right mx-1 small text-muted"></i> Cập nhật xe: {{ xe.bienso }}
{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="max-width: 650px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0 text-warning-emphasis">
                <i class="fa-solid fa-pen-to-square me-2"></i>Cập Nhật & Gia Hạn Xe Vé Tháng
            </h5>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Biển số xe</label>
                        <input type="text" class="form-control bg-light font-monospace" value="{{ xe.bienso }}" readonly disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Sinh viên sở hữu</label>
                        <input type="text" class="form-control bg-light" value="{{ xe.sinh_vien.hoten }} ({{ xe.sinh_vien.masv }})" readonly disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Loại phương tiện</label>
                        <input type="text" name="loaixe" class="form-control" value="{{ xe.loaixe|default:'' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Đơn giá tháng (VNĐ)</label>
                        <input type="number" name="dongiathang" class="form-control" required value="{{ xe.dongiathang }}" min="0" step="10000">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày đăng ký ban đầu</label>
                        <input type="date" class="form-control bg-light" value="{{ xe.ngaydangky|date:'Y-m-d' }}" readonly disabled>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Ngày hết hạn mới (Gia hạn) <span class="text-danger">*</span></label>
                        <input type="date" name="ngayhethan" class="form-control" value="{{ xe.ngayhethan|date:'Y-m-d' }}" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'danh_sach_xe' %}" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-warning fw-semibold">
                        <i class="fa-solid fa-save me-1"></i> Lưu cập nhật
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
