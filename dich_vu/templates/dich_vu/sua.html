{% extends 'base.html' %}

{% block title %}Sửa dịch vụ {{ dv.tendichvu }} - Ký Túc Xá{% endblock %}

{% block breadcrumb %}
    <a href="{% url 'danh_sach_dich_vu' %}" class="text-decoration-none text-secondary">Dịch vụ</a>
    <i class="fa-solid fa-chevron-right mx-1 small text-muted"></i> Sửa dịch vụ
{% endblock %}

{% block content %}
<div class="container-fluid p-0" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0 text-warning-emphasis">
                <i class="fa-solid fa-pen-to-square me-2"></i>Chỉnh Sửa Dịch Vụ
            </h5>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mã dịch vụ</label>
                    <input type="text" class="form-control bg-light font-monospace" value="{{ dv.madichvu }}" readonly disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên dịch vụ <span class="text-danger">*</span></label>
                    <input type="text" name="tendichvu" class="form-control" required value="{{ dv.tendichvu }}">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                    <input type="number" name="dongia" class="form-control" required value="{{ dv.dongia }}" min="0" step="1000">
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'danh_sach_dich_vu' %}" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-warning fw-semibold">
                        <i class="fa-solid fa-save me-1"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
